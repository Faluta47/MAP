# Copy this file to config.properties (not tracked by Git) and fill in the real database password.
# Persistence type: MEMORY | FILE | DATABASE
repository.type=FILE

# FILE: paths relative to the working directory (project root)
file.utilizatori=data/utilizatori.txt
file.prietenii=data/prietenii.txt

# DATABASE: PostgreSQL (create the database first: CREATE DATABASE socialnetwork;)
db.url=jdbc:postgresql://localhost:5432/socialnetwork
db.user=postgres
db.password=CHANGE_ME
